server:
  port: 8081

spring:
  application:
    name: order-producer-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shopflow_orders?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:rootpw}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    # correlated: enables publisher confirms AND attaches an id to each
    # message, so a confirm can be traced back to the order that sent it
    publisher-confirm-type: correlated
    # surfaces messages the broker could not route to any queue
    publisher-returns: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: always

# ── application settings ──────────────────────────────────────
shopflow:
  catalog:
    base-url: ${CATALOG_BASE_URL:https://fakestoreapi.com}
  cache:
    product-ttl: 10m
    order-ttl: 5m

# ── resilience: circuit breaker, retry, time limiter ──────────
resilience4j:
  circuitbreaker:
    instances:
      productCatalog:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
  retry:
    instances:
      productCatalog:
        max-attempts: 3
        wait-duration: 200ms
        exponential-backoff-multiplier: 2
  timelimiter:
    instances:
      productCatalog:
        timeout-duration: 2s